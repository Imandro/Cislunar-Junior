<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba visual de misión - Cañon Labs</title></head>
<body style="margin:0;background:#0a0f16;color:#8fc9ff;font:14px ui-monospace,Consolas,monospace;padding:10px">
<!--
  Humo visual: recorre una misión completa dentro del iframe, eligiendo siempre
  la primera opción de cada evento, y anota lo que observa. Sirve el proyecto en
  la raíz para que funcione:

      python -m http.server 8899     →  http://localhost:8899/tools/prueba_mision.html
-->
<div id="log" style="white-space:pre-wrap;margin-bottom:8px">Iniciando…</div>
<iframe id="cj" src="/Cislunar%20Junior%20-%20Ca%C3%B1on%20Labs.html"
        style="width:100%;height:1500px;border:0;display:block"></iframe>
<script>
window.addEventListener('load', function () {
  var log = document.getElementById('log');
  var f = document.getElementById('cj');
  var d = null, lineas = [], pasos = 0, MAX = 40;
  function decir(t) { lineas.push(t); log.textContent = lineas.join('\n'); }

  f.onload = function () {
    setTimeout(function () {
      try { d = f.contentDocument; } catch (e) { decir('ERROR: ' + e.message); return; }
      if (!d) { decir('No se pudo leer el documento. Sírvelo por HTTP, no por file://.'); return; }
      var tarjetas = d.querySelectorAll('.mcard');
      var nom = d.querySelector('.mcard h3');
      decir('Selección: ' + tarjetas.length + ' misiones · primera: ' +
            (nom ? nom.textContent : 'sin nombre'));
      if (tarjetas.length !== 4) { decir('FALLO: se esperaban 4 tarjetas.'); return; }
      var btnLab = d.querySelector('[data-a="lab"]');
      decir('Accesos: ' + (btnLab ? 'laboratorio presente' : 'SIN laboratorio'));
      tarjetas[3].click();                       // Marte
      setTimeout(paso, 900);
    }, 2600);
  };

  function paso() {
    pasos++;
    if (pasos > MAX) { decir('Se alcanzó el límite de pasos.'); return; }
    d = f.contentDocument;
    var met = d.querySelector('.met');
    var visor = d.querySelector('#visor');
    var btns = d.querySelectorAll('#vbtns .vbtn');
    decir('paso ' + pasos + ' · ' + (met ? met.textContent : '?') +
          ' · visor ' + (visor ? visor.clientWidth + '×' + visor.clientHeight : 'ausente') +
          ' · vistas ' + btns.length);

    var conf = d.querySelector('[data-a="confirmar"]');
    if (conf) { conf.click(); setTimeout(paso, 650); return; }

    var opt = d.querySelector('.opts .opt');
    if (!opt) {
      var fin = d.querySelector('.endbox');
      decir(fin ? 'FINAL: ' + fin.textContent.replace(/\s+/g, ' ').slice(0, 220)
                : 'No quedan decisiones ni bloque final.');
      return;
    }
    opt.click();
    setTimeout(paso, 350);
  }
});
</script></body></html>
