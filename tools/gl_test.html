<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#111;color:#0f0;font:16px monospace">
<canvas id="c" width="400" height="300"></canvas>
<div id="r">iniciando...</div>
<script src="/js/glcore.js"></script>
<script>
var out=document.getElementById('r');
var c=document.getElementById('c');
try{
  var R=CJ.GL.crear(c);
  if(!R){ out.textContent='SIN WEBGL'; }
  else{
    var g=R.gl;
    // triangulo de prueba
    var pol=[{v:[[0,20,0],[40,0,0],[0,0,40]], c:[200,80,80,1,40]}];
    R.subir('t',pol);
    var asp=R.ajustar(400,300);
    R.fondo(10,14,22);
    R.dibujar({foco:[10,10,10],dist:80,fov:0.9,yaw:0.4,pit:0.2,aspecto:asp},
      [{clave:'t',polys:pol}],{cielo:[10,14,22],niebla:2000});
    // leer un pixel para confirmar que se dibujo algo
    var px=new Uint8Array(4);
    g.readPixels(200,150,1,1,g.RGBA,g.UNSIGNED_BYTE,px);
    out.textContent='WEBGL OK | version='+g.getParameter(g.VERSION)+' | version_gl='+g.getParameter(g.SHADING_LANGUAGE_VERSION)+' | pixel=('+px[0]+','+px[1]+','+px[2]+','+px[3]+')';
  }
}catch(e){ out.textContent='ERROR: '+e.message; }
</script></body></html>
