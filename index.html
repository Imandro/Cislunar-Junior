    S.autoScroll = ev.target.checked;
  }
});

function conectarPuntero() {
  document.addEventListener('pointerdown', function (e) {
    var v = e.target.closest ? e.target.closest('.visor') : null;
    if (!v || MODO !== 'juego' || VM !== 0) return;
    ARRASTRE = { x: e.clientX, y: e.clientY, yaw: YAW, pit: PIT };
    try { v.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.addEventListener('pointermove', function (e) {
    if (!ARRASTRE) return;
    YAW = ARRASTRE.yaw + (e.clientX - ARRASTRE.x) * 0.008;
    PIT = Math.max(-1.2, Math.min(1.2, ARRASTRE.pit + (e.clientY - ARRASTRE.y) * 0.006));
  });
  document.addEventListener('pointerup', function () { ARRASTRE = null; });
  document.addEventListener('pointercancel', function () { ARRASTRE = null; });
  document.addEventListener('wheel', function (e) {
    var v = e.target.closest ? e.target.closest('.visor') : null;
    if (!v || MODO !== 'juego' || VM !== 0) return;
    e.preventDefault();
    if (e.shiftKey) {
      // Shift + rueda = velocidad de cámara en modo libre
      CAM_SPEED = Math.max(0.2, Math.min(5, CAM_SPEED * (1 - e.deltaY * 0.001)));
    } else if (CAM_MODE === 'free') {
      // En modo libre, rueda = FOV
      ZM = Math.max(0.45, Math.min(3.4, ZM * (1 - e.deltaY * 0.0012)));
    } else {
      // Modo orbital: rueda = zoom
      ZM = Math.max(0.45, Math.min(3.4, ZM * (1 - e.deltaY * 0.0012)));
    }
  }, { passive: false });
  window.addEventListener('resize', function () { if (MODO === 'juego') pintar(); });

  // Keydown para movimiento de cámara libre
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    /* Enter o Espacio sobre una tarjeta de misión la arranca */
    if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
      var ae = document.activeElement;
      if (ae && ae.classList && ae.classList.contains('mcard') &&
          ae.dataset && ae.dataset.m != null) {
        e.preventDefault(); tono(520, 0.1); nuevaPartida(parseInt(ae.dataset.m, 10));
        return;
      }
    }
    if (MODO !== 'juego' || !S) return;

    // Controles de cámara libre (WASD, Q/E, C, R, F)
    if (CAM_MODE === 'free' && VM === 0) {
      if (k === 'w' || k === 'W') { CAM_INPUT.forward = 1; e.preventDefault(); }
      else if (k === 's' || k === 'S') { CAM_INPUT.back = 1; e.preventDefault(); }
      else if (k === 'a' || k === 'A') { CAM_INPUT.left = 1; e.preventDefault(); }
      else if (k === 'd' || k === 'D') { CAM_INPUT.right = 1; e.preventDefault(); }
      else if (k === 'q' || k === 'Q') { CAM_INPUT.up = 1; e.preventDefault(); }
      else if (k === 'e' || k === 'E') { CAM_INPUT.down = 1; e.preventDefault(); }
      else if (k === 'c' || k === 'C') {
        // Toggle modo cámara
        if (CAM_MODE === 'orbital') {
          // Orbital -> Libre: posicionar detrás del vehículo
          var info = escena3D();
          var distCam = info.ft[1] * 2.4;
          CAM_POS = [0, info.ft[0], distCam];
          CAM_VEL = [0, 0, 0];
          CAM_MODE = 'free';
        } else {
          CAM_MODE = 'orbital';
        }
        e.preventDefault();
      }
      else if (k === 'r' || k === 'R') {
        // Reset cámara
        CAM_MODE = 'orbital';
        YAW = 0.62; PIT = 0.2; ZM = 1;
        CAM_POS = [0, 0, 0];
        CAM_VEL = [0, 0, 0];
        e.preventDefault();
      }
      else if (k === 'f' || k === 'F') {
        // Focus: teletransportar detrás del vehículo
        var info = escena3D();
        var distCam = info.ft[1] * 2.4;
        CAM_POS = [0, info.ft[0], distCam];
        CAM_VEL = [0, 0, 0];
        e.preventDefault();
      }
    }

    // Controles comunes (flechas, zoom, vista)
    if (k === 'ArrowLeft') { YAW -= 0.09; e.preventDefault(); }
    else if (k === 'ArrowRight') { YAW += 0.09; e.preventDefault(); }
    else if (k === 'ArrowUp') { PIT = Math.min(1.2, PIT + 0.07); e.preventDefault(); }
    else if (k === 'ArrowDown') { PIT = Math.max(-1.2, PIT - 0.07); e.preventDefault(); }
    else if (k === '+' || k === '=') { ZM = Math.min(3.4, ZM * 1.12); }
    else if (k === '-') { ZM = Math.max(0.45, ZM / 1.12); }
    else if (k === '1' || k === '2' || k === '3') { VM = parseInt(k, 10) - 1; GR(); return; }
    else return;
    if (VM === 0) pintar();
  });

  // Keyup para soltar movimiento
  document.addEventListener('keyup', function (e) {
    var k = e.key;
    if (CAM_MODE !== 'free' || VM !== 0) return;
    if (k === 'w' || k === 'W') CAM_INPUT.forward = 0;
    else if (k === 's' || k === 'S') CAM_INPUT.back = 0;
    else if (k === 'a' || k === 'A') CAM_INPUT.left = 0;
    else if (k === 'd' || k === 'D') CAM_INPUT.right = 0;
    else if (k === 'q' || k === 'Q') CAM_INPUT.up = 0;
    else if (k === 'e' || k === 'E') CAM_INPUT.down = 0;
  });
}

/* =======================================================================
 * ARRANQUE
 * ==================================================================== */
function inicio() {
  cargarAjustes();
  construirTerrenos();
  conectarPuntero();
  document.addEventListener('click', onClickGlobal);
  abrirSala();

  var pasos = [
    'Inicializando el núcleo orbital',
    'Compilando los shaders del visor 3D',
    'Cargando el expediente de Apolo 11',
    'Cargando el expediente de Apolo 13',
    'Cargando el expediente de Artemis II',
    'Cargando el expediente de Marte',
    'Calibrando instrumentos de cabina',
    'Sistema de vuelo listo'
  ];
  var fin = function () {
    if (location.hash === '#lab') abrirLab();
    else mostrarSel();
    iniciarGL();
  };
  if (CJ.BOOT && CJ.BOOT.cargar) {
    CJ.BOOT.cargar(fin, { pasos: pasos, hint: 'Simulador de decisiones de misión espacial · Cañon Labs' });
  } else {
    fin();
  }
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inicio);
  else inicio();
}
